{% extends 'base.html' %}

{% block title %}Reset Password - CPMS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6 col-md-8">
        <div class="glass-card p-4 p-md-5 animate-fade-in">
            <div class="d-flex align-items-center gap-2 mb-3">
                <span class="navbar-brand-icon" style="width: 36px; height: 36px; font-size: 1rem;">
                    <i class="fa-solid fa-lock text-success"></i>
                </span>
                <h3 class="fw-bold text-white mb-0">Set New Password</h3>
            </div>
            <p class="text-muted small mb-4">Please enter and confirm your new password below.</p>

            <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label form-label-custom">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-key"></i></span>
                        <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Enter new password" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label form-label-custom">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-check-double"></i></span>
                        <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 justify-content-center mb-3">
                    <i class="fa-solid fa-rotate me-2"></i> Reset Password
                </button>
            </form>

            <div class="text-center text-muted small mt-4">
                Remember your password? <a href="{{ url_for('login') }}" class="text-indigo text-decoration-none fw-semibold">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
