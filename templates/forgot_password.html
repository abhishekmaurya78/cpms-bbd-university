{% extends 'base.html' %}

{% block title %}Forgot Password - CPMS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6 col-md-8">
        <div class="glass-card p-4 p-md-5 animate-fade-in">
            <div class="d-flex align-items-center gap-2 mb-3">
                <span class="navbar-brand-icon" style="width: 36px; height: 36px; font-size: 1rem;">
                    <i class="fa-solid fa-key text-warning"></i>
                </span>
                <h3 class="fw-bold text-white mb-0">Forgot Password</h3>
            </div>
            <p class="text-muted small mb-4">Enter your registered email address and we will send you a secure link to reset your password.</p>

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label form-label-custom">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control form-control-custom" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 justify-content-center mb-3">
                    <i class="fa-solid fa-paper-plane me-2"></i> Send Reset Link
                </button>
            </form>

            <div class="text-center text-muted small mt-4">
                Remember your password? <a href="{{ url_for('login') }}" class="text-indigo text-decoration-none fw-semibold">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
