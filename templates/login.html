{% extends 'base.html' %}

{% block title %}Sign In - CPMS Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-2 mb-4">
                <span class="navbar-brand-icon" style="width: 32px; height: 32px; font-size: 0.9rem;">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <h3 class="fw-bold text-white mb-0">Sign In to CPMS</h3>
            </div>
            <p class="text-muted small mb-4">Enter your credentials to log into your dashboard.</p>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="login-email" class="form-label form-label-custom">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i
                                class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control form-control-custom" id="login-email" name="email"
                            placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="login-password" class="form-label form-label-custom">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i
                                class="fa-solid fa-key"></i></span>
                        <input type="password" class="form-control form-control-custom" id="login-password"
                            name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 justify-content-center mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                </button>

                <div class="text-center mb-3">
                    <a href="{{ url_for('forgot_password') }}" class="text-muted small text-decoration-none">
                        <i class="fa-solid fa-key me-1"></i> Forgot Password?
                    </a>
                </div>
            </form>

            <div class="text-center text-muted small mt-3">
                Don't have an account? <a href="{{ url_for('register') }}"
                    class="text-indigo text-decoration-none fw-semibold">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
